<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>熊出没森林探险 — 3岁宝宝互动版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 游戏主容器 -->
    <div id="game-container">
        <!-- 背景层（四季切换） -->
        <div id="background" class="season-spring"></div>
        
        <!-- 粒子层（飘花瓣/落叶/雪花） -->
        <div id="particle-layer"></div>

        <!-- 开始界面 -->
        <div id="start-screen">
            <h1>🐻 熊出没森林探险 🌲</h1>
            <p>3岁宝宝专属互动游戏</p>
            <button id="start-btn">🎮 点击进入全屏游戏</button>
            <div class="parent-tips">
                <p>👨‍👩‍👧 家长提示：进入后所有按键都将被孩子接管。</p>
                <p>退出：长按 <strong>Command + Shift + W</strong> 3秒</p>
                <p>备用：方向键 <strong>上上下下左右左右</strong></p>
            </div>
        </div>

        <!-- 游戏画布（用于绘制粒子、文字特效） -->
        <canvas id="fx-canvas"></canvas>

        <!-- 角色层 -->
        <div id="character-layer"></div>

        <!-- 数字认知展示层 -->
        <div id="number-display" class="hidden">
            <div id="number-big"></div>
            <div id="number-chinese"></div>
            <div id="number-count-area"></div>
        </div>

        <!-- 任务通知层 -->
        <div id="task-banner" class="hidden">
            <div id="task-text"></div>
        </div>

        <!-- 季节指示器 -->
        <div id="season-indicator">
            <span id="season-emoji">🌸</span>
            <span id="season-name">春天</span>
        </div>

        <!-- 退出提示层 -->
        <div id="exit-overlay" class="hidden">
            <div class="progress-bar-container">
                <div id="exit-progress"></div>
            </div>
            <p>正在退出...</p>
        </div>

        <!-- 战斗系统 (保卫森林) -->
        <div id="battle-overlay" class="hidden">
            <div class="battle-hp-bar">
                <div id="battle-progress"></div>
            </div>
            <div id="battle-logger" class="battle-logger"></div>
        </div>

        <!-- 胜利撒花层 -->
        <div id="confetti-layer"></div>
    </div>

    <script src="sounds.js"></script>
    <script src="number-task.js"></script>
    <script src="task-system.js"></script>
    <script src="game.js"></script>
</body>
</html>
